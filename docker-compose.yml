services:
  postgres:
    image: postgres:16-alpine
    container_name: whale_tracker_db
    environment:
      POSTGRES_DB: whale_tracker
      POSTGRES_USER: whale_user
      POSTGRES_PASSWORD: whale_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
